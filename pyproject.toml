[project]
name = "bookrecommender"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "magnifiq", email = "git.projectsss@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "openai",
    "httpx>=0.27,<1",
    "pydantic-settings",
    "pytest",
    "pytest-asyncio",
]

[project.scripts]
bookrecommender = "bookrecommender:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
