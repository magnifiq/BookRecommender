[project]
name = "bookrecommender-frontend"
version = "0.1.0"
description = "Gradio frontend for the BookRecommender FastAPI service"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6,<7",
    "httpx>=0.27,<1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
